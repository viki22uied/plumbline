name: CI

# NFR-06: the automated test suite runs on every code change.
# NFR-10: the matrix proves the core engine runs on Linux, macOS and Windows.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Python
        uses: actions/setup-python@a26af695f322a270e7d80d0d6f8b1d1c1a81d3de # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,oracle]"

      - name: Validate the engines against QuantLib
        # An external oracle this author did not write. Runs before the rest,
        # because if the reference engines are wrong nothing after it means much.
        run: pytest -m oracle

      - name: Run the test suite without the native backend
        # The backend is optional, so the suite has to be green before it is
        # built. The native tests skip themselves here.
        run: pytest -m "not slow" --cov=plumbline/engines --cov=plumbline/audit --cov-report=term-missing --cov-report=xml

      - name: Enforce the coverage floor (NFR-07)
        run: python -m coverage report --fail-under=85

      - name: Audit the correct sample, which must pass (AC-05)
        run: plumbline audit samples/good_model.py --out reports --no-history

      - name: Audit the broken sample, which must fail (AC-04)
        shell: bash
        run: |
          if plumbline audit samples/broken_model.py --out reports --no-history; then
            echo "the broken sample passed the audit, which means the audit is broken"
            exit 1
          fi

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-reports-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: ignore

  native:
    name: native backend / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-python@a26af695f322a270e7d80d0d6f8b1d1c1a81d3de # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The runners ship a working C++ toolchain on all three platforms:
      # g++ on Ubuntu, Apple clang on macOS, MSVC on Windows.
      - name: Build the native backend
        run: python native/build.py --check

      - name: Confirm the CLI sees it
        run: plumbline backend

      - name: Run the native backend tests
        # -p no:randomly is not needed; these tests are order independent.
        run: pytest tests/test_native_backend.py -v

      - name: Run the whole suite with the backend present
        run: pytest -m "not slow"

      - name: Benchmark against NumPy
        run: python benchmarks/bench_backends.py --paths 200000 --steps 120 --repeats 2 --markdown --json benchmark-${{ matrix.os }}.json

      - name: Upload the benchmark
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-${{ matrix.os }}
          path: benchmark-${{ matrix.os }}.json
          if-no-files-found: ignore

  slow:
    name: long simulations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-python@a26af695f322a270e7d80d0d6f8b1d1c1a81d3de # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the tests marked slow
        run: pytest -m slow
