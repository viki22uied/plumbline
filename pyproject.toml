[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plumbline"
version = "1.1.0"
description = "Independent verification engine for derivative pricing models"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vignesh Kumar U" }]
license = { text = "Apache-2.0" }
keywords = [
    "quantitative-finance",
    "option-pricing",
    "model-validation",
    "model-risk-management",
    "derivatives",
    "black-scholes",
    "monte-carlo",
    "finite-difference",
    "heston-model",
    "local-volatility",
    "binomial-tree",
    "exotic-options",
    "greeks",
    "numerical-methods",
    "financial-engineering",
    "arbitrage-free",
    "quant",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "reportlab>=4.0",
    "matplotlib>=3.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "pytest-xdist>=3.5", "httpx>=0.27"]
oracle = ["QuantLib>=1.30", "financepy>=1.0", "pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/viki22uied/plumbline"
Repository = "https://github.com/viki22uied/plumbline"
Issues = "https://github.com/viki22uied/plumbline/issues"
Changelog = "https://github.com/viki22uied/plumbline/blob/main/CHANGELOG.md"

[project.scripts]
plumbline = "plumbline.cli:main"

[tool.setuptools.packages.find]
include = ["plumbline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n 4"
markers = [
    "slow: a test that needs many simulation paths; deselect with -m 'not slow'",
    "oracle: validation against QuantLib, an independent external implementation",
    "fast: pure numerics, no subprocess and no HTTP; the inner-loop lane",
    "integration: sandbox, audit engine, reports, CLI and API",
    "native: the optional C++ backend, skipped when it is not built",
]

[tool.coverage.run]
source = ["plumbline/engines", "plumbline/audit"]
